  --blue-line: #5F86BA;

    --paper-2: #2F2B23;

    --line: #443E30;
    --sage: #86A15A;
    --sage-deep: #A9C77A;
    --sage-soft: #333F29;
    --pink: #F27DB3;
    --pink-soft: #4C2B3D;
    --blue: #2F4663;
    --blue-line: #8DB0DE;
    --dark: #0E0D0B;
    --stripe-b: #2F2B23;
    --shadow: rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --desk: #12110E;
  --paper: #26231D;
  --paper-2: #2F2B23;
  --ink: #F4EFE0;
  --muted: #BDB6A1;
  --line: #443E30;
  --sage: #86A15A;
  --sage-deep: #A9C77A;
  --sage-soft: #333F29;
  --pink: #F27DB3;
  --pink-soft: #4C2B3D;
  --blue: #2F4663;

*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); }
body {
  margin: 0;
  background: var(--desk);
  background-image: radial-gradient(1200px 600px at 10% -10%, color-mix(in srgb, var(--sage) 22%, transparent), transparent), radial-gradient(900px 500px at 100% 30%, color-mix(in srgb, var(--pink) 10%, transparent), transparent);

  overflow: clip;

.pad { padding: clamp(20px, 4vw, 48px); }

/* Masthead */
.mast {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  padding: 12px clamp(16px, 3vw, 32px);
  display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap;
}

.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab {
  font-family: var(--mono); font-size: .85rem; font-weight: 500; text-decoration: none;
  padding: 6px 16px; border-radius: 999px;
  background: var(--blue); border: 1.5px dashed var(--blue-line); color: var(--ink);
}
.tab:hover { border-style: solid; }
.tab[aria-current="page"] { background: var(--sage); border: 1.5px solid var(--sage); color: #1c2610; font-weight: 600; }

/* Section bands */
.band { border-top: 1px solid var(--pink); border-bottom: 1px solid var(--pink); text-align: center; padding: 16px 12px 14px; margin: 0 0 28px; }
.band h2 { font-family: var(--serif); font-style: italic; font-weight: 500; color: var(--pink); font-size: clamp(1.7rem, 4.2vw, 2.5rem); line-height: 1.15; }

.subhead { font-family: var(--serif); font-style: italic; font-weight: 500; color: var(--pink); font-size: clamp(1.45rem, 3.4vw, 2rem); line-height: 1.2; margin-bottom: 8px; }
.subtext { color: var(--muted); font-size: .88rem; max-width: 70ch; margin-bottom: 20px; }
.sec { margin-top: clamp(48px, 7vw, 80px); }

/* Cover */
.cover { display: grid; grid-template-columns: 1.15fr 1fr; gap: clamp(24px, 4vw, 48px); align-items: center; }
.stripes {

  padding: 22px 22px 30px;
}
.label {
  position: relative;
  background: var(--paper-2); padding: 14px 18px; box-shadow: 0 3px 10px var(--shadow);
  font-family: var(--serif); text-align: center;
}
.label.small { width: max-content; max-width: 90%; margin: 0 auto 18px; transform: rotate(-1.5deg); font-size: .95rem; padding: 10px 18px; }
.label.title { transform: rotate(1deg); margin: 0 6px 22px; }
.label.title h1 { font-weight: 500; font-size: clamp(1.8rem, 4.6vw, 2.7rem); line-height: 1.1; }
.label.title p { font-style: italic; font-size: 1.05rem; margin-top: 10px; line-height: 1.35; }
.tape { position: absolute; top: -13px; left: 50%; width: 86px; height: 26px; margin-left: -43px; background: var(--tape); transform: rotate(-4deg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.pin { position: absolute; top: -9px; left: 50%; width: 17px; height: 17px; margin-left: -8px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff9a9a, #d42a2a 62%); box-shadow: 0 2px 3px rgba(0,0,0,.4); }

/* Ilustración de portada */
.plate { margin: 0 6px; background: var(--paper); padding: 10px 10px 12px; box-shadow: 0 4px 14px var(--shadow); }
.plate svg { display: block; width: 100%; height: auto; }
.plate [fill="#E4ECD3"] { fill: var(--sage-soft); }
.plate [fill="#F5EFDC"] { fill: var(--paper-2); }
.plate [fill="#D8D0B8"] { fill: var(--line); }
.plate [stroke="#D8D0B8"] { stroke: var(--line); }
.plate [fill="#FDF9EE"] { fill: var(--paper); }
.plate [stroke="#FDF9EE"] { stroke: var(--paper); }
.plate [fill="#BE2E7A"] { fill: var(--pink); }
.plate [stroke="#BE2E7A"] { stroke: var(--pink); }
.plate [fill="#587633"] { fill: var(--sage-deep); }
.plate [fill="#9AB66A"] { fill: var(--sage); }
.legend { list-style: none; margin: 12px 4px 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font-size: .78rem; line-height: 1.4; }
.legend li { display: flex; gap: 8px; align-items: flex-start; }
.legend b { flex: none; width: 19px; height: 19px; border-radius: 50%; background: var(--pink); color: var(--paper); font-size: .72rem; font-weight: 600; display: grid; place-items: center; line-height: 1; }

.why h2 { font-family: var(--serif); font-style: italic; font-weight: 500; color: var(--pink); font-size: clamp(1.6rem, 3.6vw, 2.2rem); line-height: 1.15; margin-bottom: 14px; }
.why p + p { margin-top: 12px; }
.why strong { font-weight: 600; }

/* Notes */
.note { position: relative; background: var(--sage); color: #1c2610; padding: 22px 22px 20px; font-family: var(--serif); font-size: 1.3rem; line-height: 1.25; box-shadow: 0 3px 10px var(--shadow); text-align: center; }
.note.pink { background: var(--pink-soft); color: var(--ink); }
.note.rot-l { transform: rotate(-2deg); }
.note.rot-r { transform: rotate(1.5deg); }
.dashbox { border: 1.5px dashed var(--sage-deep); border-radius: 12px; padding: 16px 18px; background: color-mix(in srgb, var(--sage) 8%, var(--paper)); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 28px 40px; align-items: center; }

/* Grid-paper areas (pestaña Infografías) */
.grid-paper {
  background-color: var(--paper);
  background-image: linear-gradient(var(--sage) 1px, transparent 1px), linear-gradient(90deg, var(--sage) 1px, transparent 1px);
  background-size: 28px 28px; background-position: -1px -1px;
  padding: clamp(20px, 4vw, 40px);
  border: 1px solid var(--sage);
}
.areas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.area { background: var(--paper); border: 1.5px dashed var(--sage-deep); border-radius: 10px; padding: 14px 14px 16px; }
.area:nth-child(3n+2) { border-color: var(--blue-line); }
.area:nth-child(5n+3) { border-color: var(--pink); }
.area h3 { font-family: var(--serif); font-weight: 500; font-size: 1.12rem; line-height: 1.2; margin-bottom: 6px; }
.area p { font-size: .82rem; line-height: 1.55; color: var(--muted); }

/* Tips */
.tips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px 22px; }
.tip { position: relative; padding: 24px 20px 20px; background: var(--paper-2); box-shadow: 0 3px 10px var(--shadow); }
.tip:nth-child(4n+1) { background: var(--sage-soft); transform: rotate(-1deg); }
.tip:nth-child(4n+2) { transform: rotate(.8deg); }
.tip:nth-child(4n+3) { background: var(--pink-soft); transform: rotate(-.6deg); }
.tip:nth-child(4n+4) { transform: rotate(1.1deg); background: color-mix(in srgb, var(--blue) 45%, var(--paper)); }
.tip .em { font-size: 1.9rem; line-height: 1; display: block; margin-bottom: 10px; }
.tip h3 { font-family: var(--serif); font-weight: 500; font-size: 1.15rem; line-height: 1.25; margin-bottom: 8px; }
.tip p { font-size: .85rem; line-height: 1.6; }

/* Media cards */
.media { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.mcard { position: relative; background: var(--paper-2); padding: 14px 14px 18px; box-shadow: 0 3px 10px var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.mcard:nth-child(odd) { transform: rotate(-1deg); }
.mcard:nth-child(even) { transform: rotate(1deg); }
.screen {
  position: relative; aspect-ratio: 16 / 10; display: grid; place-items: center;
  background: repeating-linear-gradient(90deg, var(--sage) 0 14px, var(--stripe-b) 14px 28px);
}
.play { width: 62px; height: 62px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; box-shadow: 0 2px 8px var(--shadow); }
.play svg { width: 26px; height: 26px; margin-left: 4px; }
button.play { border: 0; padding: 0; cursor: pointer; }
button.play:hover { transform: scale(1.06); }
.screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.mcard h3 { font-family: var(--serif); font-weight: 500; font-size: 1.2rem; line-height: 1.2; }
.mcard p { font-size: .83rem; line-height: 1.55; color: var(--muted); }
.mcard .mnote { font-size: .76rem; font-style: italic; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font-size: .72rem; line-height: 1.5; background: var(--sage-soft); border: 1px solid var(--sage); border-radius: 999px; padding: 1px 10px; }
.pill {
  display: inline-block; align-self: flex-start; text-decoration: none; text-align: center;
  font-family: var(--mono); font-size: .88rem; font-weight: 500; color: var(--ink);
  background: var(--blue); border: 1.5px dashed var(--blue-line); border-radius: 999px; padding: 8px 20px;
}
.pill:hover { border-style: solid; }
button.pill { cursor: pointer; }
.audio { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
.acard { display: grid; grid-template-columns: 78px 1fr; gap: 16px; align-items: start; border: 1.5px dashed var(--sage-deep); border-radius: 12px; padding: 18px; background: color-mix(in srgb, var(--sage) 8%, var(--paper)); }
.acard svg { width: 78px; height: 78px; }
.acard h3 { font-family: var(--serif); font-weight: 500; font-size: 1.2rem; line-height: 1.2; margin-bottom: 4px; }
.acard p { font-size: .83rem; line-height: 1.55; color: var(--muted); margin-bottom: 12px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* Dark block */
.darkblock { background: var(--dark); color: var(--on-dark); padding: 28px 24px 30px; text-align: center; border-radius: 6px; }
.darkblock h3 { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 1.6rem; margin-bottom: 18px; }
.chipset { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 22px; }
.chipset a { text-decoration: none; font-family: var(--serif); font-style: italic; font-size: 1.05rem; padding: 4px 16px; border-radius: 999px; border: 1.5px dashed #7FA2D2; color: var(--on-dark); }
.chipset a:hover { border-style: solid; background: #2f2d28; }
.darkblock p { font-size: .85rem; margin-top: 12px; opacity: .85; }
.darkblock .pill { align-self: auto; color: #14110B; background: #C4D8F0; border-color: #7FA2D2; }

/* Matriz de resultados */
.hint { display: none; font-size: .78rem; color: var(--muted); margin-bottom: 8px; }
.matrix-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); -webkit-overflow-scrolling: touch; }
.matrix { border-collapse: separate; border-spacing: 6px; min-width: 1040px; width: 100%; font-size: .8rem; }
.matrix th, .matrix td { padding: 0; text-align: center; vertical-align: middle; }
.matrix thead th { font-family: var(--serif); font-weight: 500; font-size: 1rem; border-radius: 8px; padding: 10px 6px; background: color-mix(in srgb, var(--pc, var(--sage)) 30%, var(--paper)); }
.matrix thead th a { text-decoration: none; display: block; }
.matrix thead th a:hover { text-decoration: underline; }
.matrix thead th.corner, .matrix tbody th.area-h { position: sticky; left: 0; z-index: 3; box-shadow: 6px 0 0 var(--paper); }
.matrix thead th.corner { background: color-mix(in srgb, var(--sage) 25%, var(--paper)); text-align: left; padding-left: 12px; }
.matrix tbody th.area-h { background: color-mix(in srgb, var(--sage) 14%, var(--paper)); border-radius: 8px; padding: 8px 10px; text-align: left; font-family: var(--serif); font-weight: 500; font-size: .95rem; line-height: 1.25; min-width: 170px; }
.matrix tbody th.area-h small { display: block; font-family: var(--mono); font-weight: 400; font-size: .7rem; color: var(--muted); margin-top: 2px; }
.matrix td { background: color-mix(in srgb, var(--pc) 13%, var(--paper)); border-radius: 8px; padding: 8px 8px 9px; }
.matrix .v { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; margin-bottom: 5px; }
.matrix .v b { font-weight: 600; font-size: .9rem; }
.matrix .v span { font-size: .7rem; color: var(--muted); }
.matrix .m { height: 7px; border-radius: 999px; background: color-mix(in srgb, var(--pc) 22%, var(--paper)); overflow: hidden; }
.matrix .m span { display: block; height: 100%; background: var(--pc); border-radius: 999px; }
.matrix td.status { background: transparent; padding: 0; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; font-family: var(--serif); font-weight: 500; font-size: .92rem; white-space: nowrap; }
.badge.crit { background: #F9D0D5; color: #7C1D2B; }
.badge.mid { background: #FBE7B8; color: #6B4A07; }
.badge.good { background: #CDE9D3; color: #1F5A30; }

.legend-note { font-size: .76rem; color: var(--muted); margin-top: 10px; }

.panels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.panel { border-radius: 12px; padding: 18px 16px 12px; font-size: .82rem; line-height: 1.55; }
.panel h3 { font-family: var(--serif); font-weight: 500; font-size: 1.15rem; line-height: 1.25; margin-bottom: 12px; }
.panel h3 small { display: block; font-family: var(--mono); font-size: .72rem; color: var(--muted); font-weight: 400; margin-top: 2px; }
.panel ul, .panel ol { margin: 0; padding-left: 20px; }
.panel li { margin-bottom: 9px; }
.panel li span { color: var(--muted); white-space: nowrap; }
.panel.p1 { background: var(--sage-soft); }
.panel.p2 { background: var(--pink-soft); }
.panel.p3 { background: color-mix(in srgb, #E7B25A 24%, var(--paper)); }
.panel.p4 { background: color-mix(in srgb, var(--blue) 50%, var(--paper)); }

/* Detalle por integrante */
.people { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 28px; }
.person-tab {
  font-family: var(--serif); font-style: italic; font-size: 1.1rem; text-decoration: none;
  padding: 6px 20px; border-radius: 999px; background: var(--paper-2); border: 1.5px dashed var(--sage-deep); color: var(--ink);
}
.person-tab:hover { border-style: solid; }
.person-tab[aria-current="page"] { background: var(--pink); border-color: var(--pink); color: #fff; }
:root[data-theme="dark"] .person-tab[aria-current="page"] { color: #1a1210; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .person-tab[aria-current="page"] { color: #1a1210; } }
.score { font-family: var(--serif); font-size: clamp(1.5rem, 3.4vw, 2.1rem); line-height: 1.2; margin-bottom: 12px; }
.score em { color: var(--pink); }
.meter { height: 16px; border: 1.5px dashed var(--sage-deep); border-radius: 999px; overflow: hidden; margin-bottom: 8px; background: var(--paper); max-width: 560px; }
.meter span { display: block; height: 100%; background: var(--sage); border-radius: 999px; }
.meter-note { font-size: .82rem; color: var(--muted); margin-bottom: 26px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.col { border-radius: 12px; padding: 18px 18px 8px; }
.col.good { background: var(--sage-soft); }
.col.todo { background: var(--pink-soft); }
.col > h3 { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 1.35rem; line-height: 1.2; margin-bottom: 14px; }
.col h4 { font-family: var(--serif); font-weight: 600; font-size: 1rem; margin: 14px 0 6px; line-height: 1.25; }
.col ul { list-style: none; margin: 0 0 12px; padding: 0; }
.col li { position: relative; padding-left: 22px; font-size: .84rem; line-height: 1.55; margin-bottom: 6px; }
.col.good li::before { content: "✓"; position: absolute; left: 0; color: var(--sage-deep); font-weight: 700; }
.col.todo li::before { content: "○"; position: absolute; left: 0; color: var(--pink); font-weight: 700; }
.empty { font-size: .85rem; color: var(--muted); padding-bottom: 14px; }
.plan { margin-top: 22px; }
.plan h3 { font-family: var(--serif); font-style: italic; font-weight: 500; color: var(--pink); font-size: 1.5rem; margin-bottom: 8px; }
.plan ol { margin: 0; padding-left: 22px; }

/* Reflexiona / Recuerda */
.reflect { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
.reflect ul { margin: 10px 0 0; padding-left: 20px; font-size: .88rem; line-height: 1.6; text-align: left; }
.reflect .note { text-align: left; font-family: var(--mono); font-size: .9rem; line-height: 1.6; }
.reflect h3 { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 1.45rem; }

/* Footer */
.foot { border-top: 1px solid var(--line); padding: 26px clamp(20px, 4vw, 48px) 32px; font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 32px; justify-content: space-between; }
.foot p { max-width: 62ch; }

[hidden] { display: none !important; }

@media (max-width: 900px) {
  .cover, .pair, .reflect { grid-template-columns: 1fr; }
  .areas { grid-template-columns: repeat(2, 1fr); }
  .media, .tips { grid-template-columns: repeat(2, 1fr); }
  .panels { grid-template-columns: 1fr 1fr; }
  .hint { display: block; }
}
@media (max-width: 620px) {
  body { font-size: 15px; }
  .areas, .media, .tips, .audio, .cols, .panels { grid-template-columns: 1fr; }
  .acard { grid-template-columns: 56px 1fr; }
  .acard svg { width: 56px; height: 56px; }
  .brand span { display: none; }
  .mast { justify-content: center; }
  .legend { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
.mcard, .tip { transition: transform .2s ease; }
</style>

function matrixHTML() {
  const head = PEOPLE.map((p, i) => `<th style="--pc:${PCOLORS[i]}"><a href="#/equipo/${p.slug}">${esc(p.name)}</a></th>`).join("");
  const rows = CATS.map((c, i) => {
    const cells = PEOPLE.map((p, j) => {
      const k = p.checks[i].length, pct = Math.round(k / c.items.length * 100);
      return `<td style="--pc:${PCOLORS[j]}"><div class="v"><b>${pct}%</b><span>${k}/${c.items.length}</span></div><div class="m"><span style="width:${pct}%"></span></div></td>`;
    }).join("");
    const avg = catAvg[i], st = statusOf(avg);
    return `<tr>
      <th scope="row" class="area-h">${c.icon} ${i + 1}. ${esc(c.name)}<small>${c.items.length} aspectos</small></th>
      ${cells}
      <td style="--pc:#6FA8DC"><div class="v"><b>${Math.round(avg)}%</b></div><div class="m"><span style="width:${Math.round(avg)}%"></span></div></td>
      <td class="status"><span class="badge ${st[0]}">${st[1]} ${st[2]}</span></td>
    </tr>`;
  }).join("");
  return `
  <p class="hint">Desliza hacia los lados para ver todas las columnas.</p>
  <div class="matrix-wrap">
    <table class="matrix">
      <caption style="position:absolute;left:-9999px">Porcentaje de aspectos cumplidos por integrante y por área</caption>
      <thead><tr><th class="corner" scope="col">Área</th>${head}<th class="gh" style="--pc:#6FA8DC">Promedio grupal</th><th class="gh">Área crítica del grupo</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
  <p class="legend-note">Cada porcentaje es el número de aspectos marcados dividido entre los aspectos del área. Crítica: menos de 50%. En mejora: de 50% a 69%. Fortaleza: 70% o más. Toca un nombre para ver su detalle.</p>`;
}

  CATS.forEach((c, i) => c.short.forEach((label, k) => flat.push({ label, c: itemCount[i][k], o: flat.length })));
  const best = [...flat].sort((a, b) => b.c - a.c || a.o - b.o).slice(0, 4);
  const worst = [...flat].sort((a, b) => a.c - b.c || a.o - b.o).slice(0, 5);
  const crit = CATS.map((c, i) => ({ name: c.name, avg: catAvg[i], i })).sort((a, b) => a.avg - b.avg || a.i - b.i).slice(0, 4);
  const li = (r) => r.map((x) => `<li>${esc(x.label)} <span>(${x.c} de ${N})</span></li>`).join("");
  return `
  <div class="panels">
    <section class="panel p1"><h3>Fortalezas generales del grupo</h3><ul>${li(best)}</ul></section>
    <section class="panel p2"><h3>Debilidades más frecuentes del grupo</h3><ul>${li(worst)}</ul></section>
    <section class="panel p3"><h3>Áreas críticas del grupo<small>prioridad de intervención</small></h3>
      <ol>${crit.map((x) => `<li>${esc(x.name)} <span>(${Math.round(x.avg)}%)</span></li>`).join("")}</ol></section>
    <section class="panel p4"><h3>Plan de mejora grupal<small>propuesta a partir de los resultados</small></h3>
      <ol>
        <li>Mejorar la ergonomía: altura del escritorio, silla con soporte lumbar y teclado y mouse.</li>
        <li>Definir y cumplir un horario de estudio/trabajo, y priorizar tareas.</li>
        <li>Incorporar pausas activas cada 45-60 minutos y ejercicio físico regular.</li>
        <li>Cuidar la concentración: reducir distracciones y mejorar la ventilación.</li>
        <li>Mantener lo que ya funciona: respaldo de información, orden, control del ruido y conectividad.</li>
      </ol></section>
  </div>`;
}

function detailHTML(p) {
  const done = countFor(p), pct = Math.round(done / TOTAL * 100);
  const good = CATS.map((c, i) => {
    const ids = p.checks[i];
    return ids.length ? `<h4>${esc(c.name)}</h4><ul>${ids.map((k) => `<li>${esc(c.items[k])}</li>`).join("")}</ul>` : "";
  }).join("");
  const todo = CATS.map((c, i) => {
    const miss = c.items.map((_, k) => k).filter((k) => !p.checks[i].includes(k));
    return miss.length ? `<h4>${esc(c.name)}</h4><ul>${miss.map((k) => `<li>${esc(c.items[k])}</li>`).join("")}</ul>` : "";
  }).join("");
  const plan = p.plan ? `<div class="plan dashbox"><h3>Mi plan de mejora</h3><ol>${p.plan.map((s) => `<li>${esc(s)}</li>`).join("")}</ol></div>` : "";
  return `
    <p class="score">${esc(p.name)} cumple <em>${done} de ${TOTAL}</em> aspectos</p>
    <div class="meter" role="img" aria-label="${pct}% de los aspectos cumplidos"><span style="width:${pct}%"></span></div>
    <p class="meter-note">Lo que se marcó en la infografía de las 8 áreas.</p>
    <div class="cols">
      <div class="col good"><h3>Lo que ya cumple</h3>${good || '<p class="empty">No se marcó ningún aspecto en esta infografía.</p>'}</div>
      <div class="col todo"><h3>Áreas de mejora</h3>${todo || '<p class="empty">Se marcaron los 38 aspectos. No hay áreas de mejora pendientes.</p>'}</div>
    </div>
    ${plan}`;
}

function viewTeam(slug) {
  const p = PEOPLE.find((x) => x.slug === slug) || PEOPLE[0];
  const areas = CATS.map((c) => `<div class="area"><h3>${esc(c.name)}</h3><p>${esc(c.blurb)}</p></div>`).join("");
  const tabs = PEOPLE.map((x) => `<a class="person-tab" href="#/equipo/${x.slug}" ${x.slug === p.slug ? 'aria-current="page"' : ""}>${esc(x.name)}</a>`).join("");
  return `
  <div class="band"><h2>Infografías del equipo</h2><p>Lo que marcó cada integrante al revisar su espacio de estudio y trabajo</p></div>

  <section>
    <h3 class="subhead">Las 8 áreas que revisamos</h3>
    <p class="subtext">Cada integrante marcó lo que cumple en su espacio. Lo que no marcó es un área de mejora.</p>
    <div class="grid-paper"><div class="areas">${areas}</div></div>
  </section>

  <section class="sec">
    <h3 class="subhead">Resultados por integrante</h3>
    <p class="subtext">Porcentaje de aspectos cumplidos en cada área, con el promedio del grupo.</p>
    ${matrixHTML()}
  </section>

  <section class="sec">
    <h3 class="subhead">Lo que dicen los resultados del grupo</h3>
    ${panelsHTML()}
  </section>

  <section class="sec" id="detalle">
    <h3 class="subhead">Detalle por integrante</h3>
    <p class="subtext">Elige un nombre para ver lo que ya cumple y sus áreas de mejora.</p>
    <nav class="people" aria-label="Integrantes">${tabs}</nav>
    ${detailHTML(p)}
  </section>

  <section class="sec reflect">
    <div class="note pink rot-l"><span class="pin" aria-hidden="true"></span>
      <h3>Reflexiona</h3>
      <ul>
        <li>¿En cuáles áreas obtuviste más ✓?</li>
        <li>¿Qué aspectos necesitas mejorar?</li>
        <li>¿Cómo crees que estos cambios pueden influir en tu rendimiento académico y tu bienestar?</li>
        <li>¿Qué acción concreta puedes implementar esta semana?</li>
      </ul>
    </div>
    <div class="note rot-r"><span class="tape" aria-hidden="true"></span>
      <h3>Recuerda</h3>
      <ul>
        <li>Pequeños cambios generan grandes resultados.</li>
        <li>Un entorno saludable favorece tu concentración.</li>
        <li>Cuidar tu espacio es cuidar de ti.</li>
        <li>Tu bienestar también es parte del éxito académico y profesional.</li>
      </ul>
    </div>
  </section>`;
}

/* ============ ROUTER ============ */
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  let page = parts[0];
  if (page === "resumen") page = "equipo";
  if (!["inicio", "equipo", "tips"].includes(page)) page = "inicio";
  let html, title;
  if (page === "equipo") { html = viewTeam(parts[1]); title = "Infografías del equipo"; }
  else { html = viewHome(); title = "Inicio"; }
  $view.innerHTML = html;
  document.title = title + " – Psicología Ambiental y Salud Ocupacional";
  document.querySelectorAll(".tab").forEach((a) => {
    if (a.dataset.page === (page === "tips" ? "inicio" : page)) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  if (page === "equipo" && parts[1]) document.getElementById("detalle").scrollIntoView();
  else if (page === "tips") document.getElementById("tips").scrollIntoView();
  else window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ============ REPRODUCTORES INTEGRADOS ============ */
document.addEventListener("click", (e) => {
  const v = e.target.closest("[data-video]");
  if (v) {
    const box = v.closest(".screen");
    box.style.aspectRatio = "9 / 16";
    box.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + v.dataset.video + '?autoplay=1&rel=0&playsinline=1" title="Mini video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
    return;
  }
  const s = e.target.closest("[data-spotify]");
  if (s) {
    const player = s.closest(".acard").querySelector(".player");
    player.innerHTML = '<iframe src="https://open.spotify.com/embed/episode/' + s.dataset.spotify + '" title="Episodio de Spotify" allow="encrypted-media" style="width:100%;height:152px;border:0;border-radius:12px;margin-top:14px"></iframe>';
    s.hidden = true;
  }
});

route();
</script>
